<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="986" viewBox="0 0 1152 986" role="img" font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, monospace">
<title>One run through the agent, sandbox distributor and sandbox instance workflows</title>
<desc>Three workflows side by side, time running down, each tagged with the task queue its worker polls, with numbered arrows for each signal and the child start passing between them. The agent leases the sandbox for each turn, the second started by a theoretical UserPrompt signal; RunTool runs on the sandbox instance&#x27;s own task queue, outside every workflow, only while the agent holds the lease.</desc>
