<svg xmlns="http://www.w3.org/2000/svg" width="1128" height="910" viewBox="0 0 1128 910" role="img" font-family="'SF Mono', Menlo, Consolas, monospace">
<title>One run through the agent, sandbox distributor and sandbox instance workflows</title>
<desc>Three workflows side by side, time running down, with numbered arrows for each signal and the child start passing between them. The agent leases the sandbox for each turn, the second started by a theoretical UserPrompt signal; RunTool runs on the sandbox instance's own task queue, outside every workflow, only while the agent holds the lease.</desc>
