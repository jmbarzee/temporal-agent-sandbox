<svg xmlns="http://www.w3.org/2000/svg" width="728" height="600" viewBox="0 0 728 600" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>temporal-agent-sandbox architecture</title>
<desc>A workflow starter and three Temporal workers poll one Temporal server. The sandboxes worker creates a pod per sandbox through the Kubernetes API; the pod's sidecar worker runs commands through execd in the sandbox container.</desc>
<style>
  .bg { fill: #ffffff; }
  .region { fill: none; stroke: #d0d7de; stroke-width: 1; }
  .label { fill: #59636e; font-size: 13px; font-weight: 500; }
  .note { fill: #59636e; font-size: 12px; }
  .worker rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: 1; }
  .worker .t { fill: #3C3489; font-size: 14px; font-weight: 500; }
  .worker .s { fill: #534AB7; font-size: 12px; }
  .svc rect { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.75; }
  .svc .t { fill: #444441; font-size: 14px; font-weight: 500; }
  .svc .s { fill: #5F5E5A; font-size: 12px; }
  .starter rect { fill: none; stroke: #59636e; stroke-width: 1; stroke-dasharray: 4 4; }
  .starter .t { fill: #1f2328; font-size: 14px; font-weight: 500; }
  .starter .s { fill: #59636e; font-size: 12px; }
  .arr { fill: none; stroke: #8b949e; stroke-width: 1.25; }
  .head { fill: none; stroke: #8b949e; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .region { stroke: #3d444d; }
    .label, .note { fill: #9198a1; }
    .worker rect { fill: #3C3489; stroke: #AFA9EC; }
    .worker .t { fill: #EEEDFE; }
    .worker .s { fill: #CECBF6; }
    .svc rect { fill: #444441; stroke: #B4B2A9; }
    .svc .t { fill: #F1EFE8; }
    .svc .s { fill: #D3D1C7; }
    .starter rect { stroke: #9198a1; }
    .starter .t { fill: #e6edf3; }
    .starter .s { fill: #9198a1; }
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head" d="M2 1L8 5L2 9"/></marker></defs>
<rect class="bg" width="728" height="600" rx="10"/>
<rect class="region" x="240" y="104" width="200" height="224" rx="12"/>
<text class="label" x="256" y="122" dy="0.35em">Worker hosts</text>
<rect class="region" x="488" y="336" width="200" height="224" rx="12"/>
<text class="label" x="504" y="354" dy="0.35em">Pod sandbox-{id}</text>
<rect class="region" x="472" y="220" width="232" height="356" rx="12"/>
<text class="label" x="488" y="238" dy="0.35em">Kubernetes cluster</text>
<g class="starter"><rect x="24" y="24" width="168" height="56" rx="28.0"/>
<text class="t" x="108.0" y="43" text-anchor="middle" dy="0.35em">Workflow starter</text>
<text class="s" x="108.0" y="62" text-anchor="middle" dy="0.35em">starts workflows</text></g>
<g class="svc"><rect x="24" y="140" width="168" height="288" rx="8"/>
<text class="t" x="108.0" y="159" text-anchor="middle" dy="0.35em">Temporal</text>
<text class="s" x="108.0" y="178" text-anchor="middle" dy="0.35em">server, task queues</text></g>
<g class="worker"><rect x="256" y="140" width="168" height="56" rx="8"/>
<text class="t" x="340.0" y="159" text-anchor="middle" dy="0.35em">agent worker</text>
<text class="s" x="340.0" y="178" text-anchor="middle" dy="0.35em">Agent, CallModel</text></g>
<g class="worker"><rect x="256" y="256" width="168" height="56" rx="8"/>
<text class="t" x="340.0" y="275" text-anchor="middle" dy="0.35em">sandboxes worker</text>
<text class="s" x="340.0" y="294" text-anchor="middle" dy="0.35em">Orchestrator, Sandbox</text></g>
<g class="svc"><rect x="504" y="140" width="168" height="56" rx="8"/>
<text class="t" x="588.0" y="159" text-anchor="middle" dy="0.35em">LLM API</text>
<text class="s" x="588.0" y="178" text-anchor="middle" dy="0.35em">Anthropic Messages</text></g>
<g class="svc"><rect x="504" y="256" width="168" height="56" rx="8"/>
<text class="t" x="588.0" y="275" text-anchor="middle" dy="0.35em">Kubernetes API</text>
<text class="s" x="588.0" y="294" text-anchor="middle" dy="0.35em">create, ready, delete</text></g>
<g class="worker"><rect x="504" y="372" width="168" height="56" rx="8"/>
<text class="t" x="588.0" y="391" text-anchor="middle" dy="0.35em">sidecar worker</text>
<text class="s" x="588.0" y="410" text-anchor="middle" dy="0.35em">RunTool on sandbox-{id}</text></g>
<g class="svc"><rect x="504" y="488" width="168" height="56" rx="8"/>
<text class="t" x="588.0" y="507" text-anchor="middle" dy="0.35em">sandbox container</text>
<text class="s" x="588.0" y="526" text-anchor="middle" dy="0.35em">execd on a socket</text></g>
<path class="arr" d="M108.0 80 V138" marker-end="url(#arrow)"/>
<path class="arr" d="M256 168.0 H194" marker-end="url(#arrow)"/>
<path class="arr" d="M424 168.0 H502" marker-end="url(#arrow)"/>
<path class="arr" d="M256 284.0 H194" marker-end="url(#arrow)"/>
<path class="arr" d="M424 284.0 H502" marker-end="url(#arrow)"/>
<path class="arr" d="M504 400.0 H194" marker-end="url(#arrow)"/>
<path class="arr" d="M588.0 312 V334" marker-end="url(#arrow)"/>
<path class="arr" d="M588.0 428 V486" marker-end="url(#arrow)"/>
<g class="worker"><rect x="24" y="488.0" width="16" height="12" rx="3"/></g>
<text class="note" x="56" y="494.0" dy="0.35em">Temporal worker</text>
<g class="svc"><rect x="24" y="510.0" width="16" height="12" rx="3"/></g>
<text class="note" x="56" y="516.0" dy="0.35em">Service or API</text>
<g class="starter"><rect x="24" y="532.0" width="24" height="12" rx="6"/></g>
<text class="note" x="56" y="538.0" dy="0.35em">Workflow starter</text>
</svg>
