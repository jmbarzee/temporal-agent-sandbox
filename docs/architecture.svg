<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="693" viewBox="0 0 1152 693" role="img" font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, monospace">
<title>temporal-agent-sandbox architecture</title>
<desc>A workflow starter and three Temporal workers around one Temporal server, each worker polling its own task queue: agent, sandboxes, and sandbox-{id}. The sandboxes worker alone reaches the Kubernetes API, which creates a pod per sandbox; the pod&#x27;s sidecar worker runs commands through execd in the sandbox container.</desc>
