<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>temporal-agent-sandbox architecture</title>
<desc>A workflow starter and three Temporal workers poll one Temporal server; the sandboxes worker creates a pod per sandbox through the Kubernetes API, and the pod's sidecar worker runs commands through execd.</desc>
<style>
  .bg { fill: #ffffff; }
  .region { fill: none; stroke: #d0d7de; stroke-width: 1; }
  .label { fill: #1f2328; font-size: 14px; font-weight: 500; }
  .note { fill: #59636e; font-size: 12px; }
  .worker rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: 1; }
  .worker .t { fill: #3C3489; font-size: 14px; font-weight: 500; }
  .worker .s { fill: #534AB7; font-size: 12px; }
  .svc rect { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.75; }
  .svc .t { fill: #444441; font-size: 14px; font-weight: 500; }
  .svc .s { fill: #5F5E5A; font-size: 12px; }
  .pod rect { fill: #FAECE7; stroke: #993C1D; stroke-width: 1; stroke-dasharray: 5 4; }
  .pod .t { fill: #712B13; font-size: 14px; font-weight: 500; }
  .starter rect { fill: none; stroke: #59636e; stroke-width: 1; stroke-dasharray: 4 4; }
  .starter .t { fill: #1f2328; font-size: 14px; font-weight: 500; }
  .starter .s { fill: #59636e; font-size: 12px; }
  .arr { fill: none; stroke: #8b949e; stroke-width: 1.25; }
  .head { fill: none; stroke: #8b949e; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .region { stroke: #3d444d; }
    .label { fill: #e6edf3; }
    .note { fill: #9198a1; }
    .worker rect { fill: #3C3489; stroke: #AFA9EC; }
    .worker .t { fill: #EEEDFE; }
    .worker .s { fill: #CECBF6; }
    .svc rect { fill: #444441; stroke: #B4B2A9; }
    .svc .t { fill: #F1EFE8; }
    .svc .s { fill: #D3D1C7; }
    .pod rect { fill: #4A1B0C; stroke: #F0997B; }
    .pod .t { fill: #F5C4B3; }
    .starter rect { stroke: #9198a1; }
    .starter .t { fill: #e6edf3; }
    .starter .s { fill: #9198a1; }
  }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path class="head" d="M2 1L8 5L2 9"/>
  </marker>
</defs>
<rect class="bg" width="680" height="520" rx="10"/>

<g class="starter">
  <rect x="40" y="36" width="310" height="56" rx="28"/>
  <text class="t" x="195" y="55" text-anchor="middle" dominant-baseline="central">Workflow starter</text>
  <text class="s" x="195" y="74" text-anchor="middle" dominant-baseline="central">orchestrator once, agent per task</text>
</g>
<g class="svc">
  <rect x="440" y="36" width="200" height="56" rx="8"/>
  <text class="t" x="540" y="55" text-anchor="middle" dominant-baseline="central">LLM API</text>
  <text class="s" x="540" y="74" text-anchor="middle" dominant-baseline="central">Anthropic Messages</text>
</g>

<rect class="region" x="20" y="110" width="380" height="350" rx="12"/>
<text class="label" x="36" y="130" dominant-baseline="central">Worker hosts</text>
<rect class="region" x="420" y="110" width="240" height="350" rx="12"/>
<text class="label" x="436" y="130" dominant-baseline="central">Kubernetes cluster</text>

<g class="svc">
  <rect x="40" y="150" width="130" height="286" rx="8"/>
  <text class="t" x="105" y="174" text-anchor="middle" dominant-baseline="central">Temporal</text>
  <text class="s" x="105" y="194" text-anchor="middle" dominant-baseline="central">server</text>
  <text class="s" x="105" y="212" text-anchor="middle" dominant-baseline="central">task queues</text>
</g>

<g class="worker">
  <rect x="200" y="150" width="180" height="56" rx="8"/>
  <text class="t" x="290" y="169" text-anchor="middle" dominant-baseline="central">agent</text>
  <text class="s" x="290" y="188" text-anchor="middle" dominant-baseline="central">Agent, CallModel</text>
</g>
<g class="worker">
  <rect x="200" y="265" width="180" height="72" rx="8"/>
  <text class="t" x="290" y="284" text-anchor="middle" dominant-baseline="central">sandboxes</text>
  <text class="s" x="290" y="303" text-anchor="middle" dominant-baseline="central">Orchestrator, Sandbox</text>
  <text class="s" x="290" y="321" text-anchor="middle" dominant-baseline="central">cluster credentials</text>
</g>

<g class="pod">
  <rect x="440" y="150" width="200" height="190" rx="10"/>
  <text class="t" x="456" y="168" dominant-baseline="central">Pod sandbox-{id}</text>
</g>
<g class="worker">
  <rect x="456" y="186" width="168" height="52" rx="8"/>
  <text class="t" x="540" y="203" text-anchor="middle" dominant-baseline="central">sidecar</text>
  <text class="s" x="540" y="221" text-anchor="middle" dominant-baseline="central">queue sandbox-{id}</text>
</g>
<g class="svc">
  <rect x="456" y="264" width="168" height="52" rx="8"/>
  <text class="t" x="540" y="281" text-anchor="middle" dominant-baseline="central">sandbox</text>
  <text class="s" x="540" y="299" text-anchor="middle" dominant-baseline="central">execd on a socket</text>
</g>
<g class="svc">
  <rect x="440" y="380" width="200" height="56" rx="8"/>
  <text class="t" x="540" y="399" text-anchor="middle" dominant-baseline="central">Kubernetes API</text>
  <text class="s" x="540" y="418" text-anchor="middle" dominant-baseline="central">create, ready, delete</text>
</g>

<path class="arr" d="M150 92 V148" marker-end="url(#arrow)"/>
<path class="arr" d="M200 178 H172" marker-end="url(#arrow)"/>
<path class="arr" d="M200 301 H172" marker-end="url(#arrow)"/>
<path class="arr" d="M456 212 H410 V235 H172" marker-end="url(#arrow)"/>
<path class="arr" d="M368 150 V64 H438" marker-end="url(#arrow)"/>
<path class="arr" d="M380 301 H390 V408 H438" marker-end="url(#arrow)"/>
<path class="arr" d="M540 380 V342" marker-end="url(#arrow)"/>
<path class="arr" d="M540 238 V262" marker-end="url(#arrow)"/>

<g class="worker"><rect x="40" y="484" width="16" height="12" rx="3"/></g>
<text class="note" x="62" y="490" dominant-baseline="central">Temporal worker</text>
<g class="svc"><rect x="190" y="484" width="16" height="12" rx="3"/></g>
<text class="note" x="212" y="490" dominant-baseline="central">Service or API</text>
<g class="starter"><rect x="330" y="484" width="24" height="12" rx="6"/></g>
<text class="note" x="360" y="490" dominant-baseline="central">Workflow starter</text>
<g class="pod"><rect x="490" y="484" width="16" height="12" rx="3"/></g>
<text class="note" x="512" y="490" dominant-baseline="central">Pod per sandbox</text>
</svg>
