version: v2
modules:
  - path: proto
deps:
  - buf.build/cludden/protoc-gen-go-temporal
  - buf.build/alta/protopatch
lint:
  use:
    - STANDARD
  # Temporal workflows use Input/Output naming instead of Request/Response.
  except:
    - SERVICE_SUFFIX
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use:
    - FILE
